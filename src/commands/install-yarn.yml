description: >
  Install nvm, nodejs and yarn

parameters:
  node-major-version:
    type: string
    default: '22'

steps:
  - run:
      name: Install nvm and nodejs
      command: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
        echo 'export NVM_DIR="$HOME/.nvm"' >> $BASH_ENV
        echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> $BASH_ENV
        echo 'nvm install << parameters.node-major-version >> >> /dev/null' >> $BASH_ENV
        echo 'nvm use << parameters.node-major-version >> --silent' >> $BASH_ENV
  - run:
      name: Install yarn
      command: |
        source "$BASH_ENV"
        node -v
        corepack --version
        # Debugging: what would `apt-get install yarn` pick on this image?
        #   apt-cache policy yarn
        #   apt-cache madison yarn
        # (If you're on Ubuntu repos without Yarn's upstream repo, the package is often `yarnpkg` instead:)
        #   apt-cache policy yarnpkg
        #   apt-cache madison yarnpkg
        #
        # Ubuntu package index (pick your suite, e.g. jammy):
        #   https://packages.ubuntu.com/   (search for "yarn" / "yarnpkg")
        corepack enable
        corepack prepare yarn@1.22.22 --activate
        yarn --version
